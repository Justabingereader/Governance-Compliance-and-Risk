name: Run Azure CLI Login with OpenID Connect
on:
  push:
    branches:
      - main
      - side
    paths:
      - 'Errigal/**'
     
jobs: 
  test:
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.
      contents: read # Read permission is required to clone the repository.

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        client-id: ${{github.ref == 'refs/heads/main' && secrets.AZURE_CLIENT_ID || github.ref == 'refs/heads/side' && secrets.AZURE_CLIENT_ID_SIDE}}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
    - name: Azure CLI script
      uses: azure/cli@v2
      with:
        azcliversion: latest
        inlineScript: |
          az deployment sub create --location northeurope --template-file Errigal/Phase_1/Infrastructure/main.bicep
          # You can write your Azure CLI inline scripts here.
